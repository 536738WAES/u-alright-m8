<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Built by PT Cheung in 2026 paying homage to 2003. A Y2K-era social profile page.">
    <title>Mail | Built by PT Cheung in 2026 paying homage to 2003.</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>
    <div class="container-fluid page-wrap py-3">

        <!-- Header: logo, search box and main navigation -->
        <header class="mb-3">
            <div class="row g-3 align-items-center mb-3">
                <div class="col-12 col-md-6 col-xl-5">
                    <h1 class="mb-0">
                        <a href="index.html" class="d-inline-block">
                            <img src="assets/public/logos/u-alright-m8-logo-black.svg" class="img-fluid site-logo"
                                width="2070" height="395" alt="u alright m8, back to profile">
                        </a>
                    </h1>
                </div>
                <div class="col-12 col-md-5 col-xl-4 ms-auto">
                    <form class="d-flex gap-2" role="search" action="https://www.google.com/search" method="get">
                        <label for="search-box" class="visually-hidden">Search the web</label>
                        <input type="search" class="form-control border-dark border-3 rounded-0" id="search-box"
                            name="q" required>
                        <button type="submit" class="btn btn-dark rounded-0">Search</button>
                    </form>
                </div>
            </div>
            <nav class="main-nav bg-dark" aria-label="Main">
                <ul class="nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold" aria-current="page" href="mail.html">Mail</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#friends">Friends</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#music">Music</a></li>
                    <li class="nav-item"><button type="button" class="nav-link" data-bs-toggle="modal"
                            data-bs-target="#signout-modal">Sign Out</button></li>
                </ul>
            </nav>
        </header>

        <main>
            <div class="row g-3">
                <div class="col-12 col-lg-8">
                    <section class="card border border-3 border-dark rounded-0" aria-labelledby="mail-heading">
                        <h2 id="mail-heading" class="card-header bg-dark text-white rounded-0">PT's message centre</h2>
                        <div class="card-body">
                    <form action="https://formspree.io/f/mdegezoe" method="post">
                        <fieldset class="mb-3">
                            <legend class="fs-6 fw-bold">Your mood</legend>
                            <div class="mood-strip">
                                <input type="radio" class="btn-check" name="mood" id="mail-mood-happy" value="Happy" checked>
                                <label class="btn mood-btn" for="mail-mood-happy" title="Happy"><i class="bi bi-emoji-smile"
                                        aria-hidden="true"></i><span class="visually-hidden">Happy</span></label>
                                <input type="radio" class="btn-check" name="mood" id="mail-mood-loved-up" value="Loved up">
                                <label class="btn mood-btn" for="mail-mood-loved-up" title="Loved up"><i class="bi bi-emoji-heart-eyes"
                                        aria-hidden="true"></i><span class="visually-hidden">Luv</span></label>
                                <input type="radio" class="btn-check" name="mood" id="mail-mood-cool" value="Cool">
                                <label class="btn mood-btn" for="mail-mood-cool" title="Cool"><i class="bi bi-emoji-sunglasses"
                                        aria-hidden="true"></i><span class="visually-hidden">Cool</span></label>
                                <input type="radio" class="btn-check" name="mood" id="mail-mood-cheeky" value="Cheeky">
                                <label class="btn mood-btn" for="mail-mood-cheeky" title="Cheeky"><i class="bi bi-emoji-wink"
                                        aria-hidden="true"></i><span class="visually-hidden">Cheeky</span></label>
                                <input type="radio" class="btn-check" name="mood" id="mail-mood-confused" value="Confused">
                                <label class="btn mood-btn" for="mail-mood-confused" title="Confused"><i class="bi bi-emoji-dizzy"
                                        aria-hidden="true"></i><span class="visually-hidden">Huh</span></label>
                                <input type="radio" class="btn-check" name="mood" id="mail-mood-angry" value="Angry">
                                <label class="btn mood-btn" for="mail-mood-angry" title="Angry"><i class="bi bi-emoji-angry"
                                        aria-hidden="true"></i><span class="visually-hidden">Angry</span></label>
                            </div>
                        </fieldset>
                        <p class="mb-3"><span class="fw-bold">To:</span> PT</p>
                        <div class="mb-3">
                            <label for="mail-name" class="form-label fw-bold">Your name</label>
                            <input type="text" class="form-control border-dark rounded-0" id="mail-name"
                                name="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="mail-email" class="form-label fw-bold">Your email</label>
                            <input type="email" class="form-control border-dark rounded-0" id="mail-email"
                                name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="mail-subject" class="form-label fw-bold">Subject</label>
                            <input type="text" class="form-control border-dark rounded-0" id="mail-subject"
                                name="_subject" value="WASSSSSUPPPPP" required>
                        </div>
                        <div class="mb-3">
                            <label for="mail-text" class="form-label fw-bold">Message</label>
                            <textarea class="form-control border-dark rounded-0" id="mail-text" name="message"
                                rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-dark rounded-0">Send</button>
                    </form>
                        </div>
                    </section>
                </div>
                <div class="col-12 col-lg-4">
                    <section class="card border border-3 border-dark rounded-0" aria-labelledby="how-heading">
                        <h2 id="how-heading" class="card-header bg-dark text-white rounded-0">How it works</h2>
                        <div class="card-body">
                            <p>Your message goes privately to PT. Only PT reads it.</p>
                            <p class="mb-0"><a href="index.html">Back to profile</a></p>
                        </div>
                    </section>
                </div>
            </div>
        </main>

        <footer class="border-top border-3 border-dark pt-3">
            <p class="mb-0">Built by PT Cheung in 2026 paying homage to 2003. Built by PT Cheung, 2026.</p>
        </footer>

    </div>

    <!-- Sign Out pop-up -->
    <div class="modal fade" id="signout-modal" tabindex="-1" aria-labelledby="signout-modal-title" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border border-3 border-dark rounded-0">
                <div class="modal-header">
                    <h2 class="modal-title" id="signout-modal-title">Sign Out</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>You cannot sign out.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-dark rounded-0" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
